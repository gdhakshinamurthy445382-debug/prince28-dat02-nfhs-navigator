
# CD: after CI passes on main -> migrate Neon -> deploy exact Git commit to Render -> smoke test.
# Rollback: Actions -> CD -> Run workflow -> paste an older commit SHA.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (rollback). Migrations are skipped."
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}
    env:
      SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      # Fetch main and full history first.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Checkout the exact commit to deploy (supports rollback).
      - name: Checkout deployment commit
        run: git checkout --detach "${SHA}"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - run: uv sync --locked

      - name: Run migrations on Neon (normal deploys only)
        if: github.event_name == 'workflow_run'
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Tell Render to deploy this exact Git commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Deploying commit: ${SHA}"
          curl --fail --silent --show-error -X POST "${HOOK}&ref=${SHA}"

      - name: Smoke test the live URL
        run: uv run python scripts/smoke.py "${{ vars.LIVE_URL }}" --expect-version "${SHA}"
